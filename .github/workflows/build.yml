# Builds the Windows VST3 with Microsoft's compiler (JUCE 8 needs it) on GitHub's Windows machine.
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get JUCE 8
        run: git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE.git JUCE8
      - name: Configure
        run: cmake -B build -A x64 -DHL_JUCE=JUCE8
      - name: Build
        run: cmake --build build --config Release --target HalfLife_VST3 --parallel
      - name: Check the plugin file
        shell: bash
        run: ls -la "build/HalfLife_artefacts/Release/VST3/Half Life.vst3/Contents/x86_64-win/" && sha256sum "build/HalfLife_artefacts/Release/VST3/Half Life.vst3/Contents/x86_64-win/Half Life.vst3"
      - uses: actions/upload-artifact@v4
        with:
          name: HalfLife-VST3-win64
          path: build/HalfLife_artefacts/Release/VST3/
          if-no-files-found: error
      - name: Save the plugin to the private "builds" branch
        shell: bash
        run: |
          mkdir out && cp "build/HalfLife_artefacts/Release/VST3/Half Life.vst3/Contents/x86_64-win/Half Life.vst3" out/HalfLife.vst3
          cd out && git init -q && git checkout -q -b builds
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add HalfLife.vst3 && git commit -qm "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds
